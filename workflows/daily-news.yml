name: 每日科技资讯推送（Gemini 免费版）

on:
  schedule:
    # 东京时间早上 9:00 = UTC 00:00
    - cron: "0 0 * * *"

  # 允许手动触发（方便测试）
  workflow_dispatch:

jobs:
  send-tech-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: pip install requests

      - name: 🚀 运行资讯推送脚本
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID:   ${{ secrets.SLACK_USER_ID }}
        run: python scripts/fetch_and_send.py
